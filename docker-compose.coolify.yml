# VIP Network on Coolify: one "Docker Compose" resource, four services, one public domain.
#
#   web    nginx: the frontend build + proxy of /api and the WebSocket to the API  <- public domain
#   api    FastAPI (migrations + defaults on start; background loops: e-mails, campaigns,
#          invites, billing reminders, AI jobs)
#   db     Postgres 16 + pgvector
#   redis  cache (and a future job queue)
#   storage MinIO: bucket "vip" with images and attachments, keys <company-slug>/<kind>/<file>
#          (private: files are served by the API at /api/v1/media/..., no public domain needed)
#
# Values written as ${...} appear in the resource's Environment Variables in Coolify; the
# SERVICE_* ones are generated by Coolify itself. Fill VIP_* secrets there, never in this file.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vip
      POSTGRES_USER: vip
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vip -d vip"]
      interval: 10s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

  storage:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vip
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO}
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      VIP_ENV: prod
      VIP_PORT: 3399
      VIP_LOG_LEVEL: INFO
      VIP_DATABASE_URL: postgresql+asyncpg://vip:${SERVICE_PASSWORD_POSTGRES}@db:5432/vip
      VIP_REDIS_URL: redis://redis:6379/0
      VIP_JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      VIP_COOKIE_SECURE: "true"
      # same origin as the web service: https://<your-domain>
      VIP_FRONTEND_URL: ${VIP_FRONTEND_URL}
      VIP_CORS_ORIGINS: ${VIP_FRONTEND_URL}
      VIP_FERNET_KEY: ${VIP_FERNET_KEY}
      VIP_EMAIL_PROVIDER: ${VIP_EMAIL_PROVIDER:-smtp}
      VIP_EMAIL_FROM: ${VIP_EMAIL_FROM:-VIP Network <nao-responda@vipnetwork.com.br>}
      VIP_EMAIL_REPLY_TO: ${VIP_EMAIL_REPLY_TO}
      VIP_EMAIL_SMTP_HOST: ${VIP_EMAIL_SMTP_HOST}
      VIP_EMAIL_SMTP_PORT: ${VIP_EMAIL_SMTP_PORT:-465}
      VIP_EMAIL_SMTP_SECURITY: ${VIP_EMAIL_SMTP_SECURITY:-ssl}
      VIP_EMAIL_SMTP_USER: ${VIP_EMAIL_SMTP_USER}
      VIP_EMAIL_SMTP_PASSWORD: ${VIP_EMAIL_SMTP_PASSWORD}
      # Stripe: webhook endpoint https://<domain>/api/v1/billing/webhooks/stripe
      VIP_STRIPE_SECRET_KEY: ${VIP_STRIPE_SECRET_KEY}
      VIP_STRIPE_PUBLISHABLE_KEY: ${VIP_STRIPE_PUBLISHABLE_KEY}
      VIP_STRIPE_WEBHOOK_SECRET: ${VIP_STRIPE_WEBHOOK_SECRET}
      VIP_STRIPE_PRICE_MONTHLY: ${VIP_STRIPE_PRICE_MONTHLY}
      VIP_STRIPE_PRICE_ANNUAL: ${VIP_STRIPE_PRICE_ANNUAL}
      VIP_CNPJ_PROVIDERS: ${VIP_CNPJ_PROVIDERS:-aiware,cnpja}
      VIP_AIWARE_API_URL: ${VIP_AIWARE_API_URL}
      VIP_AIWARE_API_TOKEN: ${VIP_AIWARE_API_TOKEN}
      VIP_WEOS_API_URL: ${VIP_WEOS_API_URL:-https://api-weos.wegen-ai.com/api/v2/public}
      VIP_WEOS_API_TOKEN: ${VIP_WEOS_API_TOKEN}
      VIP_WEOS_WORKSPACE_ID: ${VIP_WEOS_WORKSPACE_ID}
      VIP_S3_ENDPOINT: http://storage:9000
      VIP_S3_ACCESS_KEY: vip
      VIP_S3_SECRET_KEY: ${SERVICE_PASSWORD_MINIO}
      VIP_S3_BUCKET: vip
      VIP_UPLOAD_DIR: /data/uploads
      VIP_SUPERUSER_PASSWORD: ${VIP_SUPERUSER_PASSWORD}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:3399/health')\""]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 120s

  web:
    build: ./frontend
    environment:
      - SERVICE_FQDN_WEB_80
      - API_UPSTREAM=api:3399
    depends_on:
      api:
        condition: service_started

volumes:
  db-data:
  redis-data:
  storage-data:
  uploads:
