<title>VIP Network Protótipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy + gold executive network. Public site = dark navy bands with light content bands (follows home_ideia.png).
   App = sidebar shell, light work surface, gold reserved for Discover + primary actions. */
:root{
  --navy-950:#070F1F; --navy-900:#0B1630; --navy-800:#12213F; --navy-700:#1B2D52;
  --gold:#C9A14A; --gold-hi:#E8CB82; --gold-lo:#9C7428;
  --grad-gold:linear-gradient(135deg,#E8CB82 0%,#C9A14A 45%,#A87C2F 100%);
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#F7F8FB; --line:#E2E5EE; --line-2:#D3D8E4;
  --fg:#0E1930; --fg-2:#2D3954; --muted:#5D6780; --gold-ink:#86621C;
  --buy:#1E7B53; --buy-bg:#E3F4EB; --sell:#2457B8; --sell-bg:#E5EDFB; --part:#7340B8; --part-bg:#EFE7FA; --net:#5D6780; --net-bg:#ECEEF3;
  --ok:#1E7B53; --warn:#A6660F; --warn-bg:#FBF0DC; --bad:#B7372F; --bad-bg:#FBE6E4;
  --shadow-sm:0 1px 2px rgba(14,25,48,.06),0 1px 1px rgba(14,25,48,.04);
  --shadow-md:0 8px 24px rgba(14,25,48,.10),0 2px 6px rgba(14,25,48,.06);
  --shadow-lg:0 24px 60px rgba(7,15,31,.28);
  --f-display:"Montserrat","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-sm:8px; --r-md:12px; --r-lg:18px;
  --side-l:max(16px, env(safe-area-inset-left, 0px)); --side-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070E1C; --surface:#0E1932; --surface-2:#12203D; --line:#1D2B4A; --line-2:#2A3A5E;
  --fg:#EDF0F6; --fg-2:#C9D0DF; --muted:#94A0B9; --gold-ink:#E2C27A;
  --buy:#5CC994; --buy-bg:#123227; --sell:#7FA7F2; --sell-bg:#152647; --part:#B693EC; --part-bg:#271B42; --net:#A3ADC4; --net-bg:#1B2742;
  --ok:#5CC994; --warn:#E5AE55; --warn-bg:#33260F; --bad:#F08A80; --bad-bg:#3A1A18;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 8px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070E1C; --surface:#0E1932; --surface-2:#12203D; --line:#1D2B4A; --line-2:#2A3A5E;
  --fg:#EDF0F6; --fg-2:#C9D0DF; --muted:#94A0B9; --gold-ink:#E2C27A;
  --buy:#5CC994; --buy-bg:#123227; --sell:#7FA7F2; --sell-bg:#152647; --part:#B693EC; --part-bg:#271B42; --net:#A3ADC4; --net-bg:#1B2742;
  --ok:#5CC994; --warn:#E5AE55; --warn-bg:#33260F; --bad:#F08A80; --bad-bg:#3A1A18;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 8px 24px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- shared atoms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 18px;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap;transition:transform .15s,box-shadow .15s,background .15s}
.btn:active{transform:translateY(1px)}
.btn-gold{background:var(--grad-gold);color:#1A1306;box-shadow:0 4px 14px rgba(201,161,74,.35)}
.btn-gold:hover{box-shadow:0 6px 20px rgba(201,161,74,.5)}
.btn-ghost-light{border-color:rgba(255,255,255,.7);color:#fff;background:transparent}
.btn-ghost-light:hover{background:rgba(255,255,255,.08)}
.btn-outline{border-color:var(--line-2);background:var(--surface);color:var(--fg)}
.btn-outline:hover{border-color:var(--fg-2)}
.btn-navy{background:var(--navy-800);color:#fff}
:root[data-theme="dark"] .btn-navy{background:var(--navy-700)}
.btn-danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn-lg{padding:14px 24px;font-size:15px}
.icon{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.c-buy{background:var(--buy-bg);color:var(--buy)} .c-sell{background:var(--sell-bg);color:var(--sell)} .c-part{background:var(--part-bg);color:var(--part)} .c-net{background:var(--net-bg);color:var(--net)}
.c-ok{background:var(--buy-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)} .c-bad{background:var(--bad-bg);color:var(--bad)}
.c-gold{background:rgba(201,161,74,.16);color:var(--gold-ink)}
.mono{display:inline-grid;place-items:center;flex:none;border-radius:10px;color:#fff;font-family:var(--f-display);font-weight:700;letter-spacing:.02em}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink)}
.muted{color:var(--muted)}
.wrap{max-width:1200px;margin:0 auto;padding-left:var(--side-l);padding-right:var(--side-r)}

/* ---------- PUBLIC ---------- */
.pub-nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(7,15,31,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.06)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--navy-950)}
.pub-nav .wrap{display:flex;align-items:center;gap:28px;height:72px}
.pub-nav img{height:40px;width:auto}
.pub-links{display:flex;gap:26px;margin-left:auto}
.pub-links a{color:#E6E9F0;text-decoration:none;font-size:14px;font-weight:500}
.pub-links a:hover{color:var(--gold-hi)}
.pub-nav .enter{color:#fff;text-decoration:none;font-weight:500;font-size:14px}
.burger{display:none;margin-left:auto;background:none;border:0;color:#fff;padding:8px}
.pub-mobile{display:none;background:var(--navy-900);padding-block:8px 18px}
.pub-mobile a{display:block;color:#fff;text-decoration:none;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}
@media (max-width: 920px){.pub-links,.pub-nav .enter,.pub-nav .btn{display:none}.burger{display:block}.pub-mobile.open{display:block}}

.hero{position:relative;overflow:hidden;background:radial-gradient(1200px 500px at 75% 10%,rgba(201,161,74,.16),transparent 60%),linear-gradient(180deg,var(--navy-950),var(--navy-900));color:#fff}
.hero::after{content:"";position:absolute;inset:0;background:url(img/02_networking_executivo.jpg) center/cover;opacity:.12;mix-blend-mode:luminosity;pointer-events:none}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding-block:64px 56px}
.hero h1{font-size:clamp(32px,4.6vw,52px);line-height:1.08;font-weight:700}
.hero h1 em{font-style:normal;background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{margin-top:18px;font-size:18px;color:#D4DAE6;max-width:54ch}
.hero .ctas{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}
.hero .three{margin-top:26px;display:flex;flex-wrap:wrap;gap:8px 18px;font-weight:600;color:var(--gold-hi);font-size:14px}
.hero .three span{display:inline-flex;align-items:center;gap:6px}
.phone-stage{position:relative;height:440px;display:grid;place-items:center}
.phone{position:relative;z-index:2;width:250px;height:440px;border-radius:38px;background:#0A0F1C;padding:10px;box-shadow:var(--shadow-lg),0 0 0 2px #2A3550}
.phone-screen{height:100%;border-radius:30px;background:#F3F4F8;overflow:hidden;color:#0E1930;display:flex;flex-direction:column}
.phone-top{background:var(--navy-900);padding:22px 14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.phone-top img{height:20px}
.phone-tabs{display:flex;gap:4px;font-size:10.5px;color:#C7CEDD}
.phone-tabs span{padding:3px 9px;border-radius:999px}
.phone-tabs span.on{background:#fff;color:var(--navy-900);font-weight:700}
.mini-card{margin:12px;border-radius:16px;background:#fff;box-shadow:var(--shadow-md);overflow:hidden;flex:1;display:flex;flex-direction:column}
.mini-card .cover{height:120px;background-size:cover;background-position:center;position:relative}
.mini-card .cover .chip{position:absolute;right:8px;top:8px;background:rgba(10,15,28,.75);color:var(--gold-hi);font-size:10px}
.mini-card .body{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.mini-card h4{font-size:14px;display:flex;align-items:center;gap:5px}
.mini-card .row{display:flex;gap:4px;flex-wrap:wrap}
.mini-card .row .chip{font-size:10px;padding:1px 7px}
.mini-card p{font-size:11px;color:#5D6780}
.mini-card .acts{display:flex;justify-content:center;gap:18px;padding:8px 0 12px}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:0}
.round.x{background:#fff;box-shadow:var(--shadow-md);color:#5D6780}
.round.h{background:var(--grad-gold);color:#fff;box-shadow:0 4px 12px rgba(201,161,74,.45)}
.side-card{position:absolute;z-index:1;width:150px;height:250px;border-radius:18px;background:#fff;box-shadow:var(--shadow-lg);overflow:hidden;color:#0E1930}
.side-card .cover{height:110px;background-size:cover;background-position:center}
.side-card .b{padding:10px;font-size:12px}
.side-card b{display:block;font-family:var(--f-display);font-size:13px}
.side-card.l{left:2%;top:90px;transform:rotate(-9deg)} .side-card.r{right:2%;top:80px;transform:rotate(8deg)}
@media (max-width: 920px){.hero .wrap{grid-template-columns:1fr;padding-block:40px}.phone-stage{height:420px}}
@media (max-width: 480px){.side-card{display:none}}

.strip{background:var(--navy-950);color:#E6E9F0;border-top:1px solid rgba(255,255,255,.06)}
.strip .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-block:18px}
.strip div.it{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;font-weight:600;padding:6px 10px;border-right:1px solid rgba(255,255,255,.1)}
.strip div.it:last-child{border-right:0}
.strip .icon{color:var(--gold);width:22px;height:22px}
@media (max-width: 920px){.strip .wrap{grid-template-columns:repeat(2,1fr);gap:6px}.strip div.it{border:0;justify-content:flex-start}}

.band{padding-block:72px}
.band-light{background:var(--surface)}
.band-soft{background:var(--bg)}
.sec-head{text-align:center;max-width:680px;margin:0 auto 40px}
.sec-head h2{font-size:clamp(26px,3vw,34px);font-weight:700}
.sec-head h2::before,.sec-head h2::after{content:"";display:inline-block;width:48px;height:2px;background:var(--gold);vertical-align:middle;margin:0 16px}
.sec-head p{margin-top:10px;color:var(--muted)}
@media (max-width: 600px){.sec-head h2::before,.sec-head h2::after{display:none}}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.step{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px 22px 22px}
.step .n{position:absolute;top:-14px;left:18px;width:30px;height:30px;border-radius:50%;background:var(--grad-gold);color:#1A1306;display:grid;place-items:center;font-weight:800;font-family:var(--f-display);font-size:14px}
.step .icon{width:30px;height:30px;color:var(--fg)}
.step h3{font-size:17px;margin:12px 0 6px}
.step p{font-size:14px;color:var(--muted)}
@media (max-width: 920px){.steps{grid-template-columns:repeat(2,1fr);row-gap:30px}}
@media (max-width: 520px){.steps{grid-template-columns:1fr}}

.discover-pitch{display:grid;grid-template-columns:.9fr 1.1fr .9fr;gap:36px;align-items:center}
.discover-pitch h2{font-size:clamp(26px,3vw,34px)}
.discover-pitch h2 em{font-style:normal;color:var(--gold-ink)}
.discover-pitch p{margin-top:14px;color:var(--fg-2);font-size:16px}
.fan{position:relative;height:340px}
.fan .fc{position:absolute;left:50%;top:10px;width:230px;height:310px;margin-left:-115px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-md);overflow:hidden}
.fan .fc .cover{height:130px;background-size:cover;background-position:center}
.fan .fc:nth-child(1){transform:translateX(-90px) rotate(-10deg) scale(.9);opacity:.8}
.fan .fc:nth-child(2){transform:translateX(90px) rotate(10deg) scale(.9);opacity:.8}
.fan .fc:nth-child(3){z-index:2}
.fan .fc .b{padding:12px;display:flex;flex-direction:column;gap:8px}
.fan .fc h4{font-size:15px;display:flex;gap:6px;align-items:center}
.ex-list{display:flex;flex-direction:column;gap:12px}
.ex-list h3{font-size:17px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ex{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;font-size:14px}
.ex .icon{color:var(--gold-ink);width:22px;height:22px;margin-top:1px}
@media (max-width: 980px){.discover-pitch{grid-template-columns:1fr}.fan{max-width:420px;margin:0 auto;width:100%}}

.opps{display:grid;grid-template-columns:1fr 1fr;background:var(--navy-900);color:#fff}
.opps .ph{min-height:340px;background:url(img/01_reuniao_empresarial.jpg) center/cover}
.opps .txt{padding:48px var(--side-r) 48px 48px}
.opps h2{font-size:clamp(24px,2.6vw,32px)}
.opps .sub{color:#C9D0DF;margin-top:8px}
.opps .grid4{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:28px}
.opps .g{display:flex;gap:12px}
.opps .g .icon{color:var(--gold);width:28px;height:28px}
.opps .g b{display:block;font-size:15px}
.opps .g span{font-size:13.5px;color:#B8C1D4}
@media (max-width: 860px){.opps{grid-template-columns:1fr}.opps .ph{min-height:220px}.opps .txt{padding:36px var(--side-r) 36px var(--side-l)}}
@media (max-width: 480px){.opps .grid4{grid-template-columns:1fr}}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.duo .tile{position:relative;border-radius:var(--r-lg);overflow:hidden;min-height:240px;display:flex}
.tile.events{background:var(--navy-900);color:#fff}
.tile.events .ph{width:44%;background:url(img/03_jantar_networking.jpg) center/cover}
.tile .tx{flex:1;padding:28px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.tile h3{font-size:24px}
.tile h3 em{font-style:normal;color:var(--gold-hi)}
.tile.mentor{background:var(--surface);border:1px solid var(--line)}
.tile.mentor h3 em{color:var(--gold-ink)}
.tile.mentor .ph{width:42%;background:url(img/04_retrato_mentoria_ilustrativo.jpg) center top/cover}
@media (max-width: 860px){.duo{grid-template-columns:1fr}}
@media (max-width: 480px){.duo .tile{flex-direction:column}.duo .tile .ph{width:100%;height:180px}.tile.mentor{flex-direction:column-reverse}}

.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-items:stretch}
.plan{border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;background:var(--surface);display:flex;flex-direction:column;gap:12px;position:relative}
.plan h3{font-size:17px;display:flex;align-items:center;gap:8px}
.plan .price{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:-.02em}
.plan .price small{font-size:15px;font-weight:600;color:var(--muted)}
.plan ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.plan li{display:flex;gap:8px}
.plan li .icon{color:var(--gold-ink);width:16px;height:16px;margin-top:3px}
.plan .btn{margin-top:auto}
.plan.trial{background:linear-gradient(160deg,rgba(201,161,74,.12),transparent 60%),var(--surface)}
.plan.trial h3{font-size:24px;color:var(--gold-ink)}
.plan.featured{background:var(--navy-900);color:#fff;border-color:var(--gold);box-shadow:var(--shadow-lg)}
.plan.featured .price{color:var(--gold-hi)} .plan.featured .price small{color:#C9D0DF}
.plan.featured li .icon{color:var(--gold-hi)}
.plan .flag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--grad-gold);color:#1A1306;font-size:12px;font-weight:700;padding:3px 12px;border-radius:999px;white-space:nowrap}
.boost-row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600}
.boost-row b{color:var(--gold-ink);font-family:var(--f-display)}
@media (max-width: 1040px){.plans{grid-template-columns:repeat(2,1fr)}}
@media (max-width: 560px){.plans{grid-template-columns:1fr}}
.cta-band{background:linear-gradient(90deg,var(--navy-950),var(--navy-800));color:#fff}
.cta-band .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-block:44px}
.cta-band h2{font-size:clamp(22px,2.6vw,30px)}
.cta-band h2 em{font-style:normal;color:var(--gold-hi)}
.cta-band p{color:#C9D0DF;margin-top:6px;max-width:62ch}
.pub-foot{background:var(--navy-950);color:#C9D0DF;font-size:14px}
.pub-foot .wrap{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:28px;padding-block:44px}
.pub-foot img{height:38px}
.pub-foot h4{color:#fff;font-size:14px;margin-bottom:10px}
.pub-foot a{display:block;text-decoration:none;padding:3px 0}
.pub-foot a:hover{color:var(--gold-hi)}
@media (max-width: 760px){.pub-foot .wrap{grid-template-columns:1fr 1fr}}
.faq{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.faq details{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);padding:14px 18px}
.faq summary{font-weight:600;cursor:pointer}
.faq p{margin-top:8px;color:var(--fg-2)}

/* ---------- SIGNUP ---------- */
.su{min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.su-top{background:var(--navy-950);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.su-top .wrap{display:flex;align-items:center;height:64px;gap:16px}
.su-top img{height:34px}
.su-top .save{margin-left:auto;color:#B8C1D4;font-size:13px;display:flex;align-items:center;gap:6px}
.su-body{display:grid;grid-template-columns:280px 1fr;gap:28px;padding-block:32px 60px;align-items:start}
.su-steps{position:sticky;top:96px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.su-progress{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin:8px 0 14px}
.su-progress i{display:block;height:100%;background:var(--grad-gold);transition:width .3s}
.su-steps ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.su-steps li button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:8px;border-radius:8px;text-align:left;font-size:14px;color:var(--muted)}
.su-steps li button .d{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.su-steps li.done button{color:var(--fg-2)} .su-steps li.done .d{background:var(--buy-bg);border-color:var(--buy);color:var(--buy)}
.su-steps li.cur button{background:var(--surface-2);color:var(--fg);font-weight:600} .su-steps li.cur .d{border-color:var(--gold);background:var(--gold);color:#1A1306}
.su-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:32px;min-width:0}
.su-panel h2{font-size:26px}
.su-panel .intro{color:var(--muted);margin-top:6px;margin-bottom:24px;max-width:62ch}

.drawer .cover{height:200px;background-size:cover;background-position:center;position:relative}
.drawer .cover .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px, env(safe-area-inset-right,0px))}
.drawer .d-body{padding:0 24px 28px;display:flex;flex-direction:column;gap:18px}
.drawer .d-head{display:flex;align-items:flex-end;gap:14px;margin-top:-30px;position:relative}
.drawer .d-head .mono{border:4px solid var(--surface)}
.prof-acts{display:flex;flex-wrap:wrap;gap:8px}
.toast-host{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(520px,calc(100vw - 32px))}
.toast{background:var(--navy-900);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:14px;display:flex;gap:10px;align-items:flex-start;animation:pop .2s ease-out;width:100%}
.toast .icon{color:var(--gold-hi);margin-top:1px}
@media (max-width: 980px){.toast-host{bottom:calc(90px + env(safe-area-inset-bottom,0px))}}

/* kanban */
.kanban-scroll{overflow-x:auto;padding-bottom:8px}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:260px;gap:14px;min-width:min-content}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column;gap:10px}
.kcol h3{font-size:13px;display:flex;justify-content:space-between;padding:4px 4px 2px;color:var(--fg-2)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-sm)}
.kcard .id{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.kcard b{font-size:14px}
.kcard .v{font-family:var(--f-display);font-weight:700;font-size:15px}
.kcard .nx{font-size:12.5px;color:var(--fg-2);display:flex;gap:6px;align-items:flex-start}
.kcard .nx .icon{width:14px;height:14px;margin-top:2px;color:var(--gold-ink)}
.kcol.won{border-color:rgba(30,123,83,.35)} .kcol.lost{opacity:.75}

/* chat */
.chat{display:grid;grid-template-columns:300px minmax(0,1fr) 280px;height:calc(100dvh - 200px);min-height:520px;overflow:hidden}
.chat .clist{border-right:1px solid var(--line);overflow:auto}
.chat .citem{display:flex;gap:10px;padding:14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.chat .citem.on{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--gold)}
.chat .citem .tx{flex:1;min-width:0}
.chat .citem b{font-size:14px;display:flex;justify-content:space-between;gap:6px}
.chat .citem .op{font-size:12px;color:var(--gold-ink);font-weight:600}
.chat .citem p{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat .unread{background:var(--gold);color:#1A1306;border-radius:999px;font-size:11px;padding:0 7px;font-weight:800}
.thread{display:flex;flex-direction:column;min-width:0}
.thread-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.thread-h .tx{flex:1;min-width:0}
.thread-h b{font-size:15px}
.msgs{flex:1;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.msg{max-width:72%;padding:10px 13px;border-radius:14px;font-size:14px;background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--navy-800);color:#fff;border-color:var(--navy-800)}
.msg .who{font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:2px}
.msg.me .who{color:#B8C1D4}
.msg.sys{align-self:center;background:transparent;border:0;font-size:12.5px;color:var(--muted);text-align:center;max-width:90%}
.msg .att{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;background:var(--surface-2);color:var(--fg);font-size:13px}
.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:flex-end}
.compose textarea{flex:1;border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;resize:none;height:44px;background:var(--surface)}
.chat .side-info{border-left:1px solid var(--line);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.side-info h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.side-info textarea{width:100%;min-height:110px;border:1px solid var(--line-2);border-radius:10px;padding:10px;background:var(--surface);font-size:13.5px}
.funnel{display:flex;flex-direction:column;gap:4px}
.funnel span{font-size:13px;padding:5px 10px;border-radius:7px;color:var(--muted)}
.funnel span.done{color:var(--fg-2)}
.funnel span.cur{background:rgba(201,161,74,.15);color:var(--gold-ink);font-weight:700}
@media (max-width: 1240px){.chat{grid-template-columns:280px minmax(0,1fr)}.chat .side-info{display:none}}
@media (max-width: 760px){.chat{grid-template-columns:1fr;height:calc(100dvh - 210px)}.chat.has-thread .clist{display:none}.chat:not(.has-thread) .thread{display:none}}

/* misc */
.table-scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
.perm{text-align:center} .perm .icon{color:var(--ok);width:16px;height:16px} .perm .no{color:var(--line-2)}
.savings{background:var(--navy-900);color:#fff;border-radius:var(--r-lg);padding:20px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.savings .big{font-family:var(--f-display);font-weight:800;font-size:34px;color:var(--gold-hi)}
.savings .calc{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:13.5px;color:#C9D0DF}
.savings .calc b{color:#fff;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width: 640px){.savings{grid-template-columns:1fr}}
.ev{display:flex;flex-direction:column;overflow:hidden}
.ev .ph{height:150px;background-size:cover;background-position:center;position:relative}
.ev .ph .chip{position:absolute;left:12px;top:12px}
.ev .b{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.ev h3{font-size:16px}
.ev .m{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.ev .m span{display:flex;gap:6px;align-items:center}
.ev .m .icon{width:15px;height:15px}
.ev .seats{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.ev .seats i{display:block;height:100%;background:var(--grad-gold)}
.ev .f{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:6px;flex-wrap:wrap}
.qr{width:96px;height:96px;display:grid;grid-template-columns:repeat(21,1fr);background:#fff;padding:6px;border-radius:8px;border:1px solid var(--line)}
.qr i{background:#0E1930}
.qr i.o{background:transparent}
.report-sec{border-bottom:1px solid var(--line);padding:16px 18px}
.report-sec:last-child{border:0}
.report-sec h3{font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.report-sec p,.report-sec li{font-size:14px;color:var(--fg-2)}
.report-sec ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.src{font-size:12px;color:var(--muted)}
.mentor-hero{display:grid;grid-template-columns:1fr 320px;background:var(--navy-900);color:#fff;border-radius:var(--r-lg);overflow:hidden}
.mentor-hero .tx{padding:32px;display:flex;flex-direction:column;gap:12px}
.mentor-hero h2{font-size:28px}
.mentor-hero h2 em{font-style:normal;color:var(--gold-hi)}
.mentor-hero .ph{background:url(img/04_retrato_mentoria_ilustrativo.jpg) center top/cover;min-height:280px}
.mentor-hero .price{font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--gold-hi)}
@media (max-width: 860px){.mentor-hero{grid-template-columns:1fr}.mentor-hero .ph{min-height:240px;order:-1}}
.locked{position:relative}
.locked::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,var(--surface) 85%);border-radius:inherit}
.profile-cover{height:200px;border-radius:var(--r-lg) var(--r-lg) 0 0;background:url(img/05_empresa_edificio.jpg) center/cover}
.profile-head{display:flex;gap:16px;align-items:flex-end;padding:0 22px;margin-top:-34px;flex-wrap:wrap}
.profile-head .mono{border:4px solid var(--surface)}
.prov{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:1px 7px}
.prov.of{background:var(--sell-bg);color:var(--sell)} .prov.me{background:var(--net-bg);color:var(--net)} .prov.ai{background:rgba(201,161,74,.15);color:var(--gold-ink)}
.dept{display:flex;flex-direction:column;gap:10px}
.avs{display:flex}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11.5px;font-weight:700;border:2px solid var(--surface);margin-left:-8px}
.avs .av:first-child{margin-left:0}
.noperm{padding:60px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.noperm .icon{width:40px;height:40px;color:var(--muted)}
.statline{display:flex;gap:28px;flex-wrap:wrap}
.statline div b{display:block;font-family:var(--f-display);font-size:22px}
.statline div span{font-size:12.5px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:10px;font-size:13px}
.bar .tr{flex:1;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--gold)}
.bar .tr i.org{background:var(--line-2)}
.choice.three{grid-template-columns:repeat(3,1fr)}
@media (max-width: 860px){.choice.three{grid-template-columns:1fr}}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width: 760px){.slots{grid-template-columns:1fr}}
.slot{border:1.5px dashed var(--line-2);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:8px;min-height:160px;background:var(--surface);min-width:0}
.slot.used{border-style:solid;border-color:var(--line)}
.slot .n{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.tg:last-child{border-bottom:0}
.tg input[type=checkbox]{appearance:none;-webkit-appearance:none;width:40px;height:22px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}

.tg input[type=checkbox]:checked::after{transform:translateX(18px)}
.tg input[type=checkbox]:disabled{opacity:.6;cursor:not-allowed}
.perks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.perks li{display:flex;gap:9px}
.perks li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:8px;flex:none}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{padding-left:20px;margin-left:13px;border-left:1px dashed var(--line-2)}
.tree li{padding:5px 0}
.tree .node{display:inline-flex;gap:8px;align-items:center;font-size:14px;flex-wrap:wrap}
.admin-link{display:flex;align-items:center;gap:10px;margin-top:auto;padding:9px 12px;border-radius:9px;border:1px dashed rgba(232,203,130,.35);color:var(--gold-hi);text-decoration:none;font-size:13px}
.admin-link.on{background:rgba(201,161,74,.14)}
.admin-link + .me{margin-top:10px}
.k{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
input.sw{appearance:none;-webkit-appearance:none;width:40px;height:22px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
input.sw:checked{background:var(--gold)} input.sw:checked::after{transform:translateX(18px)} input.sw:disabled{opacity:.6;cursor:not-allowed}
.trig{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1.6fr) minmax(0,1.3fr) 64px 64px 130px 118px;gap:14px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line)}
.trig-h{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2)}

.modal.wide{width:min(1000px,100%)}

.confirm-inline{border:1px solid var(--bad);background:var(--bad-bg);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:10px}

function reciprocity(mine, theirs) {
  if (!theirs) return {kind:'unilateral'};
  const t = theirs.intent;
  if ((mine === 'buy' && t === 'sell') || (mine === 'sell' && t === 'buy')) return {kind:'match', type: mine === 'buy' ? 'Comercial: você compra' : 'Comercial: você vende'};
  if (mine === 'part' && t === 'part') return {kind:'match', type:'Parceria'};
  if (mine === 'sell' && t === 'sell') return {kind:'mutual', msg:'Vocês dois querem vender um para o outro. Isso não vira match de compra e venda automaticamente; registramos o interesse mútuo e sugerimos uma conversa se houver complementaridade.'};
  if (mine === 'buy' && t === 'buy') return {kind:'mutual', msg:'Vocês dois querem comprar um do outro. Vamos conferir se as ofertas e as necessidades se encaixam antes de confirmar o match.'};
  return {kind:'mutual', msg:'Interesse recíproco registrado. Ainda não é um match comercial porque as intenções não se completam.'};
}
const matchOf = k => state.matches.find(m => m.org === k);
const sentOf = k => state.sent.find(s => s.org === k);

  return rows.map(r => {
    const m = matchOf(r.org), o = ORGS[r.org];

    if (m && m.origin !== 'AI_RECOMMENDATION') status = 'matched';
    else if (r.dir === 'sent' ? !!o.theirLike : !!sentOf(r.org)) status = 'mutual';
    else status = 'waiting';
    return {...r, status};
  }).sort((a, b) => b.date.localeCompare(a.date));
}

  return `<div class="app">
    <aside class="side" id="side">

VIEWS['curtidas'] = () => {
  const all = likeRows();

  const tabDef = {
    compras:{label:'Compras', groups:[['Quero comprar','Empresas de quem sua empresa quer comprar.', r=>r.dir==='sent'&&r.intent==='buy'],['Querem comprar de mim','Leads de venda: empresas que querem seus produtos.', r=>r.dir==='received'&&r.intent==='buy']]},
    vendas:{label:'Vendas', groups:[['Quero vender','Empresas para quem sua empresa quer vender.', r=>r.dir==='sent'&&r.intent==='sell'],['Querem vender para mim','Possíveis fornecedores. Eles não veem suas compras privadas.', r=>r.dir==='received'&&r.intent==='sell']]},
    parcerias:{label:'Parcerias', groups:[['Parcerias que propus','', r=>r.dir==='sent'&&r.intent==='part'],['Parcerias propostas para mim','', r=>r.dir==='received'&&r.intent==='part']]},
    todos:{label:'Todos', groups:[['Todas as curtidas','', ()=>true]]},
  };
  const counts = {compras: all.filter(r=>r.intent==='buy').length, vendas: all.filter(r=>r.intent==='sell').length, parcerias: all.filter(r=>r.intent==='part').length, todos: all.length};
  const passF = r => f==='all' || (f==='sent'&&r.dir==='sent') || (f==='received'&&r.dir==='received') || (f==='mutual'&&r.status==='mutual') || (f==='waiting'&&r.status==='waiting') || (f==='matched'&&r.status==='matched');
  const filters = [['all','Todas'],['sent','Enviadas'],['received','Recebidas'],['mutual','Recíprocas'],['waiting','Aguardando resposta'],['matched','Matches confirmados'],['archived','Arquivadas']];
  const row = r => {
    const o = ORGS[r.org];
    const st = r.status === 'waiting' ? STATUS_UI[r.dir==='sent'?'waiting_sent':'waiting_received'] : STATUS_UI[r.status];
    let acts = `<button class="btn btn-outline btn-sm" data-act="profile" data-org="${r.org}">Perfil</button>`;
    if (r.status === 'matched') acts += `<a class="btn btn-navy btn-sm" href="#mensagens" data-act="open-convo" data-org="${r.org}">Conversar</a>`;
    else if (r.dir === 'received' && r.status === 'waiting') acts += `<button class="btn btn-gold btn-sm" data-act="like-back" data-org="${r.org}">Curtir de volta</button>`;
    else if (r.dir === 'sent') acts += `<button class="btn btn-outline btn-sm" data-act="unlike" data-org="${r.org}">Retirar</button>`;
    return `<div class="row"><div class="who">${mono(r.org,40)}<div style="min-width:0"><b>${esc(o.name)}</b><span>${r.dir==='sent'?'Você curtiu':'Curtiu você'} · ${intentChip(r.intent)}</span></div></div>
      <div class="prod">${esc(r.product || '—')}</div><div class="date muted num" style="font-size:13px">${shortDate(r.date)}</div>
      <div><span class="chip ${st.chip}">${st.label}</span></div><div class="acts">${acts}</div></div>`;
  };
  const def = tabDef[tab];
  return `<section class="panel">
    <div class="tabs" role="tablist">${Object.entries(tabDef).map(([k,t])=>`<button role="tab" class="${tab===k?'on':''}" data-act="likes-tab" data-t="${k}">${t.label}<span class="cnt num">${counts[k]}</span></button>`).join('')}</div>
    <div class="panel-b"><div class="filters">${filters.map(([k,l])=>`<button class="${f===k?'on':''}" data-act="likes-filter" data-f="${k}">${l}</button>`).join('')}</div></div>
    ${def.groups.map(([title, sub, pred]) => { const items = all.filter(pred).filter(passF); return `
      ${def.groups.length > 1 || tab==='todos' ? `<div class="sub-h"><h3>${title}</h3><span class="cnt num chip c-net">${items.length}</span>${sub?`<p>${sub}</p>`:''}</div>` : ''}
      <div class="rows">${f==='archived' ? `<div class="empty">${ic('box')}<b>Nada arquivado</b><span>Curtidas e matches que você arquivar aparecem aqui.</span></div>` : items.length ? items.map(row).join('') : `<div class="empty">${ic('heart')}<b>Nenhuma curtida aqui ainda</b><span>Use o Descobrir para curtir empresas com esta intenção.</span><a class="btn btn-outline btn-sm" href="#descobrir">Descobrir empresas</a></div>`}</div>`; }).join('')}
  </section>
  <div class="notice lock">${ic('lock')}<div style="font-size:13.5px">Quem recebe sua curtida vê o nome da sua empresa e a intenção declarada. Preços que você paga, volumes, contratos e fornecedores atuais nunca são mostrados.</div></div>`;
};

  const pre = o.theirLike ? ({buy:'sell', sell:'buy', part:'part'})[o.theirLike.intent] : (o.open.includes('sell') ? 'buy' : o.open[0]);
  openModal(`<div class="modal">
    <div class="modal-h">${mono(k,44)}<h2>Qual é o seu interesse na ${esc(o.name)}?</h2><button class="x" data-act="modal-close" aria-label="Fechar">${ic('x')}</button></div>
    <div class="modal-b">
      <div class="intents" role="radiogroup">${['buy','sell','part','net'].map(i => `<label><input type="radio" name="intent" value="${i}" ${i===pre?'checked':''} data-act="intent-pick"><b><span class="ic ${INTENT[i].chip}">${ic(INTENT[i].icon)}</span>${INTENT[i].long}</b><span>${INTENT[i].help}</span></label>`).join('')}</div>
      <div id="intentProducts"></div>
      <p class="muted" style="font-size:12.5px">A ${esc(o.name)} verá sua empresa e a intenção escolhida. Suas compras privadas não são compartilhadas.</p>
    </div>
    <div class="modal-f"><button class="btn btn-outline" data-act="modal-close">Cancelar</button><button class="btn btn-gold" data-act="intent-confirm"><svg class="icon" style="fill:currentColor;stroke:none"><use href="#i-heart"/></svg> Curtir</button></div>
  </div>`);
  renderIntentProducts(pre);
}
function renderIntentProducts(intent) {
  const o = ORGS[modalCtx.org];
  const items = intent === 'buy' ? o.products : intent === 'sell' ? ME.sells : intent === 'part' ? ['Distribuição','Indicação de clientes','Projeto conjunto','Integração de serviços'] : [];
  const pre = o.theirLike && o.theirLike.product;
  $('#intentProducts').innerHTML = items.length ? `<div><div style="font-size:13px;font-weight:600;margin-bottom:8px">${intent==='buy'?'O que você quer comprar? (opcional)':intent==='sell'?'O que você quer oferecer? (opcional)':'Tipo de parceria (opcional)'}</div><div class="chipsel">${items.map((p,i)=>`<label><input type="checkbox" name="prod" value="${esc(p)}" ${p===pre||(!pre&&i===0&&intent!=='part')?'checked':''}>${esc(p)}</label>`).join('')}</div></div>` : '';
}
function confirmIntent() {
  const k = modalCtx.org, fromDeck = modalCtx.fromDeck;
  const intent = ($('input[name=intent]:checked') || {}).value || 'net';
  const prods = [...document.querySelectorAll('input[name=prod]:checked')].map(i => i.value);
  const o = ORGS[k];
  closeModal();
  state.sent = state.sent.filter(s => s.org !== k);
  state.sent.unshift({org:k, intent, product: prods.join(', ') || (intent==='net'?'Relacionamento':''), date: new Date().toISOString().slice(0,10)});
  if (fromDeck) advance(k, 'like');
  const res = reciprocity(intent, o.theirLike);
  if (res.kind === 'match') {
    const existing = matchOf(k);
    const product = o.theirLike.product;
    const m = {org:k, origin: existing && existing.origin === 'AI_RECOMMENDATION' ? 'AI_RECOMMENDATION' : 'MUTUAL_LIKE', type:res.type, product, date:new Date().toISOString().slice(0,10), status:'MATCH_CONFIRMED', reason:o.reason};
    if (existing) Object.assign(existing, m, {origin:'MUTUAL_LIKE'}); else state.matches.unshift(m);
    showMatch(k, res.type, product);
  } else if (res.kind === 'mutual') {
    toast(res.msg, 'spark');
  } else if (existing_ai(k, intent)) {
    // AI recommendation + like, awaiting the other side
    toast(`Curtida enviada. A ${esc(o.name)} foi recomendada pela IA; quando ela demonstrar interesse compatível, vira match.`, 'heart');
  } else {
    toast(`Curtida enviada. A ${esc(o.name)} verá que sua empresa tem interesse: ${INTENT[intent].short.toLowerCase()}.`, 'heart');
  }
  render();
}
const existing_ai = k => { const m = matchOf(k); return m && m.origin === 'AI_RECOMMENDATION'; };
function showMatch(k, type, product) {
  const o = ORGS[k];
  modalCtx = {type:'match', org:k};
  openModal(`<div class="modal match-modal">
    <div class="modal-h" style="justify-content:flex-end"><button class="x" data-act="modal-close" aria-label="Fechar" style="background:rgba(255,255,255,.1);color:#fff">${ic('x')}</button></div>
    <div class="modal-b" style="align-items:center">
      <div class="match-pair">${mono('me',84)}<span class="heart"><svg class="icon"><use href="#i-heart"/></svg></span>${mono(k,84)}</div>
      <div class="big">É MATCH!</div>
      <p style="color:#D4DAE6;max-width:40ch">As duas empresas demonstraram interesse em fazer negócios.</p>
      <dl class="match-info" style="width:100%">
        <div><dt>Empresas</dt><dd><b>${ME.name}</b> e <b>${esc(o.name)}</b></dd></div>
        <div><dt>Tipo de oportunidade</dt><dd>${esc(type)}</dd></div>
        <div><dt>Produto ou serviço</dt><dd>${esc(product)}</dd></div>
        <div><dt>Por que combinam</dt><dd>${esc(o.reason)}</dd></div>
      </dl>
      <p style="font-size:12.5px;color:#9AA6BF">O match é da empresa. Diretoria e ${type.includes('compra')?'Compras':type==='Parceria'?'Diretoria':'Comercial'} das duas empresas foram avisados.</p>
    </div>
    <div class="modal-f" style="justify-content:center"><button class="btn btn-ghost-light" data-act="modal-close">Continuar descobrindo</button><a class="btn btn-ghost-light" href="#oportunidades" data-act="modal-close">Ver oportunidade</a><button class="btn btn-gold" data-act="match-chat" data-org="${k}">Iniciar conversa</button></div>
  </div>`);
}
function openProfile(k) {
  const o = ORGS[k];
  modalCtx = {type:'profile', org:k};
  const lk = sentOf(k);
  openModal(`<div class="drawer">
    <div class="cover" style="background-image:url(img/${o.img})"><button class="x" data-act="modal-close" aria-label="Fechar">${ic('x')}</button></div>
    <div class="d-body">
      <div class="d-head">${mono(k,76)}<div style="padding-bottom:4px"><h2 style="font-size:20px;display:flex;gap:6px;align-items:center">${esc(o.name)}${o.verified?`<svg class="icon" style="color:var(--sell);width:18px;height:18px"><use href="#i-verified"/></svg>`:''}</h2><p class="muted" style="font-size:13.5px">${esc(o.seg)} · ${esc(o.city)}</p></div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${opens(o)}${o.sponsored?'<span class="chip sp">Destaque</span>':''}</div>
      <p>${esc(o.desc)}</p>
      <div class="prof-acts">
        <button class="btn btn-gold btn-sm" data-act="like-back" data-org="${k}">${ic('heart')}${lk?'Mudar curtida':'Curtir'}</button>
        <button class="btn btn-outline btn-sm" data-act="toast" data-msg="Solicitação de conexão enviada.">${ic('link')}Conectar</button>
        <button class="btn btn-outline btn-sm" data-act="toast" data-msg="Empresa salva.">${ic('bookmark')}Salvar</button>
        <button class="btn btn-outline btn-sm" data-act="toast" data-msg="Link do perfil copiado.">${ic('share')}Compartilhar</button>
      </div>
      <section><h3 style="font-size:14px;margin-bottom:8px">Portfólio</h3><div class="list-items">${o.products.map(p=>`<div class="li">${ic('box')}<div class="grow"><b>${esc(p)}</b><span class="s">Preço sob consulta</span></div></div>`).join('')}</div></section>
      <section style="display:flex;justify-content:space-between;align-items:center"><span class="muted" style="font-size:13px">Compatibilidade com sua empresa</span>${compat(o.compat)}</section>
      ${o.reason?`<div class="notice info">${ic('spark')}<div style="font-size:13.5px">${esc(o.reason)}</div></div>`:''}
      <div style="display:flex;gap:8px;border-top:1px solid var(--line);padding-top:14px"><button class="btn btn-outline btn-sm" data-act="toast" data-msg="Denúncia enviada para a moderação.">${ic('flag')}Denunciar</button><button class="btn btn-danger btn-sm" data-act="toast" data-msg="Empresa bloqueada. Ela não verá mais sua empresa nem poderá enviar mensagens.">Bloquear</button></div>
    </div></div>`, 'drawer-o');
}

/* =============== DECK MECHANICS =============== */
function topKey() { const c = $('#deck .card.top'); return c && c.dataset.org; }
function advance(k, type) {
  state.seen.add(k);
  state.history.push({org:k, type});
}
function flyOut(dir, then) {
  const c = $('#deck .card.top');
  if (!c) return then();
  c.style.transition = 'transform .35s ease-in, opacity .35s';
  c.style.transform = `translateX(${dir * 520}px) rotate(${dir * 24}deg)`;
  c.style.opacity = '0';
  setTimeout(then, 260);
}
function doSkip() { const k = topKey(); if (!k) return; flyOut(-1, () => { advance(k, 'skip'); render(); }); }
function doLike() { const k = topKey(); if (!k) return; openIntent(k, true); }
function bindDeck() {
  const c = $('#deck .card.top'); if (!c) return;
  let sx = 0, dx = 0, drag = false, id = null;
  const like = c.querySelector('.stamp.like'), skip = c.querySelector('.stamp.skip');
  c.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; drag = true; sx = e.clientX; dx = 0; id = e.pointerId; c.setPointerCapture(id); c.classList.add('dragging'); });
  c.addEventListener('pointermove', e => { if (!drag) return; dx = e.clientX - sx; c.style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`; like.style.opacity = Math.max(0, Math.min(1, dx/110)); skip.style.opacity = Math.max(0, Math.min(1, -dx/110)); });
  const end = () => { if (!drag) return; drag = false; c.classList.remove('dragging');
    if (dx > 110) { c.style.transform = 'translateX(40px) rotate(3deg)'; like.style.opacity = 1; doLike(); }
    else if (dx < -110) doSkip();
    else { c.style.transform = ''; like.style.opacity = 0; skip.style.opacity = 0; } };
  c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
}

/* =============== RENDER & EVENTS =============== */
const APP_VIEWS = new Set([...NAV.map(n => n[0]), 'admin']);
let lastView = null;
function render() {
  const v = view();
  const root = $('#root');
  const keepScroll = v === lastView;
  const y = window.scrollY;
  if (v === 'cadastro') root.innerHTML = signupPage();
  else if (v === 'convite') root.innerHTML = inviteLanding(false);
  else if (v === 'admin' || v.startsWith('admin-')) root.innerHTML = adminShell(v);
  else if (APP_VIEWS.has(v)) root.innerHTML = appShell(v);
  else root.innerHTML = publicPage();
  if (v === 'descobrir') bindDeck();
  const ms = $('#msgs'); if (ms) ms.scrollTop = ms.scrollHeight;
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
  lastView = v;
}
window.addEventListener('hashchange', () => { closeModal(); if (view() !== 'mensagens') {} render(); });

const ACTS = {
  burger: () => $('#pubMobile').classList.toggle('open'),
  'side-open': () => { $('#side').classList.add('open'); const s = document.createElement('div'); s.className = 'scrim'; s.dataset.act = 'side-close'; document.body.appendChild(s); },
  'side-close': () => { $('#side') && $('#side').classList.remove('open'); document.querySelectorAll('.scrim').forEach(s => s.remove()); },
  toast: d => toast(esc(d.msg), d.icon || 'check'),
  theme: () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; },
  period: d => { state.period = +d.p; render(); },
  sector: d => { state.disc.sector = d.s; render(); },
  skip: doSkip, like: doLike,
  save: () => { const k = topKey(); if (k) { state.saved.add(k); toast(`${esc(ORGS[k].name)} salva na sua lista.`, 'bookmark'); } },
  undo: () => { const h = state.history[state.history.length-1]; if (h && h.type === 'skip') { state.history.pop(); state.seen.delete(h.org); render(); } },
  'deck-reset': () => { state.seen.clear(); state.history = []; render(); },
  profile: d => openProfile(d.org),
  'like-back': d => { closeModal(); openIntent(d.org, false); },
  'intent-pick': (d, el) => renderIntentProducts(el.value),
  'intent-confirm': confirmIntent,
  'modal-close': () => { const ctx = modalCtx; closeModal(); if (ctx && ctx.type === 'intent' && ctx.fromDeck) { const c = $('#deck .card.top'); if (c) { c.style.transform = ''; c.querySelectorAll('.stamp').forEach(s => s.style.opacity = 0); } } },
  'match-chat': d => { closeModal(); const k = d.org; if (!CONVOS[k]) CONVOS[k] = {op:'OP-0' + (152 + Object.keys(CONVOS).length), stage:'Novo', unread:0, note:'', msgs:[{sys:true, t:'Match confirmado agora · Curtida recíproca'}]}; state.convo = k; go('mensagens'); },
  'open-convo': d => { if (CONVOS[d.org]) state.convo = d.org; else { CONVOS[d.org] = {op:'OP-0160', stage:'Novo', unread:0, note:'', msgs:[{sys:true, t:'Conversa iniciada a partir do match'}]}; state.convo = d.org; } },
  convo: d => { state.convo = d.org; CONVOS[d.org].unread = 0; render(); },
  'convo-back': () => { state.convo = null; render(); },
  unlike: d => { state.sent = state.sent.filter(s => s.org !== d.org); toast(`Curtida retirada. Ela deixa de gerar novos matches.`); render(); },
  'likes-tab': d => { state.likesTab = d.t; if (view() !== 'curtidas') return; render(); },
  'likes-filter': d => { state.likesFilter = d.f; render(); },
  'opp-filter': d => { state.oppFilter = d.f; render(); },
  'ev-toggle': d => { const e = EVENTS.find(x => x.id === d.id); if (state.regs.has(d.id)) { state.regs.delete(d.id); toast('Inscrição cancelada.'); } else { state.regs.add(d.id); toast(e.taken >= e.seats ? 'Você entrou na lista de espera. Avisaremos se abrir vaga.' : 'Inscrição confirmada. Seu QR Code de check-in está no card.'); } render(); },
  report: () => { state.report = 'running'; render(); setTimeout(() => { state.report = 'ready'; if (view()==='inteligencia') render(); toast('Seu relatório de mercado está pronto.', 'spark'); }, 2600); },
  'cancel-ask': () => { $('#cancelBox').innerHTML = `<div class="confirm-inline"><b>Cancelar a assinatura?</b><p style="font-size:14px">Você ainda está no teste grátis. Se cancelar agora, a primeira cobrança de R$ 250,00 não acontece e o acesso continua até ${fmtDT(TRIAL_END)}.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-danger btn-sm" data-act="cancel-do">Sim, cancelar</button><button class="btn btn-outline btn-sm" data-act="cancel-no">Manter assinatura</button></div></div>`; },
  'cancel-no': () => { $('#cancelBox').innerHTML = ''; },
  'cancel-do': () => { state.canceled = true; render(); toast('Assinatura cancelada. Nenhuma cobrança será feita.'); },
  reactivate: () => { state.canceled = false; render(); toast('Assinatura reativada. A primeira cobrança volta a ser agendada para o fim do teste.'); },
  'su-go': d => { state.su.step = +d.step; render(); },
  'su-prev': () => { state.su.step--; render(); },
  'su-next': () => { if (state.su.step === 4) toast(state.su.invite ? 'Plano VIP ativado. Nenhum valor foi cobrado.' : 'Teste grátis iniciado. Nenhum valor foi cobrado hoje.'); state.su.step++; render(); },
  'su-lookup': () => { state.su.cnpj = $('#cnpj').value; state.su.looked = true; state.su.taken = false; render(); },
  'su-taken': () => { state.su.taken = true; state.su.looked = false; render(); },
  'su-untake': () => { state.su.taken = false; render(); },
  'su-plan': (d, el) => { state.su.plan = el.value; },
  'su-ai': () => { state.su.aiAccepted = true; render(); },
  'inv-check': () => { state.invCheck = true; render(); },
  'inv-accept': () => { state.su = {step:1, cnpj:'12.345.678/0001-90', looked:false, taken:false, plan:'monthly', aiAccepted:false, invite:{from:'Grupo Horizonte Alimentos', cnpj:'12.345.678/0001-90', code:'VIP-AE7K-2Q9M'}}; go('cadastro'); },
  'inv-copy': d => { const link = 'https://vipnetwork.com.br/convite/' + d.code; const fail = () => toast('Copie o link: ' + esc(link)); try { navigator.clipboard.writeText(link).then(() => toast('Link do convite copiado.'), fail); } catch (err) { fail(); } },
  'inv-resend': () => toast('Convite reenviado por e-mail.', 'send'),
  'inv-revoke': d => { const i = state.myInvites.find(x => x.id === d.code); if (i) i.status = 'revoked'; toast(state.platform.returnExpired ? 'Convite cancelado. Ele voltou para os seus convites disponíveis.' : 'Convite cancelado.'); render(); },
  acct: d => { state.account = d.a; render(); },
  'vip-plan': d => { state.vipPlan = d.p; render(); },
  'adm-tab': d => { state.adminTab = d.t; render(); },
  'mail-tab': d => { state.mailTab = d.t; render(); },
  'tpl-edit': d => openTemplate(d.key),
  'tpl-var': d => { const ta = $('#tpl-body'); if (!ta) return; const s = ta.selectionStart ?? ta.value.length, e2 = ta.selectionEnd ?? s; ta.value = ta.value.slice(0, s) + d.v + ta.value.slice(e2); ta.focus(); ta.selectionStart = ta.selectionEnd = s + d.v.length; updateTplPreview(); },
  'tpl-save': () => { closeModal(); toast('Modelo salvo. Os próximos envios usam esta versão.'); },
  'camp-new': () => openCampaign(),
  'camp-create': () => { const aud = AUDIENCES.find(a => a[0] === $('#c-aud').value) || AUDIENCES[0]; const now = $('#c-when').value === 'Agora'; CAMPAIGNS.unshift({name: $('#c-name').value || 'Nova campanha', kind:'manual', status: now ? 'Enviando' : 'Agendada', aud: aud[0], n: aud[1], sent: 0, open:'—', click:'—', unsub:'—', when: now ? 'agora' : 'agendada'}); closeModal(); toast(now ? 'Campanha iniciada. O envio respeita o limite por hora.' : 'Campanha agendada.', 'send'); render(); },
  'adm-mode': (d, el) => { state.platform.mode = el.value; state.invCheck = false; if (el.value === 'invite') state.su.invite = state.su.invite || null; render(); toast(`Modo de entrada: ${MODES[el.value].label}. Abra o site público para ver a mudança.`, 'users'); },
  'adm-save': () => toast('Configuração salva. Vale para novos cadastros; quem já entrou mantém as condições do seu convite.'),
  'adm-issue': () => toast('Convite da equipe emitido. Convites da equipe não têm limite.', 'gift'),
};
document.addEventListener('click', e => {
  const sc = e.target.closest('[data-scroll]');
  if (sc) { e.preventDefault(); const t = document.getElementById(sc.dataset.scroll); $('#pubMobile') && $('#pubMobile').classList.remove('open'); if (t) t.scrollIntoView({behavior:'smooth'}); return; }
  if (e.target.closest('[data-noop]')) { e.preventDefault(); toast('Página institucional prevista no escopo.'); return; }
  const plan = e.target.closest('[data-plan]'); if (plan) state.su.plan = plan.dataset.plan;
  const el = e.target.closest('[data-act]');
  if (!el) { if (e.target.closest('.side nav a')) ACTS['side-close'](); return; }
  const fn = ACTS[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'BUTTON' || el.dataset.act === 'side-close') e.preventDefault();
  if (el.tagName === 'INPUT' && el.type === 'radio') { fn(el.dataset, el); return; }
  fn(el.dataset, el);
});
document.addEventListener('change', e => {
  const ch = e.target.dataset.change;
  if (ch === 'invitesPer') { state.platform.invitesPer = Math.max(1, Math.min(20, parseInt(e.target.value, 10) || 1)); render(); return; }
  if (ch === 'vipMonths' || ch === 'inviteTTL') { state.platform[ch] = parseInt(e.target.value, 10); render(); return; }
  if (ch === 'trig') { const key = e.target.dataset.key; if (e.target.checked) state.trigOff.delete(key); else state.trigOff.add(key); toast(e.target.checked ? 'Disparo ativado.' : 'Disparo desativado. A notificação dentro da plataforma continua.'); render(); return; }
  if (ch === 'whoInvites') { state.platform.whoInvites = e.target.value; render(); return; }
  if (ch === 'bindCnpj' || ch === 'returnExpired') { state.platform[ch] = e.target.checked; render(); return; }
  if (ch === 'role') { state.role = e.target.value; render(); toast(`Agora você vê o sistema como ${ROLES[state.role].label}.`, 'users'); }
});
document.addEventListener('submit', e => {
  if (e.target.closest('[data-form="invite"]')) {
    e.preventDefault();
    const val = id => ($('#' + id).value || '').trim();
    const cnpj = val('inv-cnpj'), company = val('inv-name'), email = val('inv-mail');
    if (!cnpj || !company || !email) { toast('Preencha o CNPJ, o nome da empresa e o e-mail do responsável.', 'flag'); return; }
    const r = () => Math.random().toString(36).slice(2, 6).toUpperCase();
    state.myInvites.push({id:`VIP-${r()}-${r()}`, company, cnpj, email, sent:new Date().toISOString().slice(0, 10), status:'pending'});
    toast(`Convite enviado para ${esc(email)}. O link vale por ${state.platform.inviteTTL} dias.`, 'send');
    render(); return;
  }
  const f = e.target.closest('[data-form="send"]'); if (!f) return;
  e.preventDefault(); const t = $('#msgIn').value.trim(); if (!t || !state.convo) return;
  CONVOS[state.convo].msgs.push({me:true, who:'Você · Diretoria', t}); render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#layer').innerHTML) { ACTS['modal-close'](); return; } ACTS['side-close'](); }
  if ($('#layer').innerHTML || view() !== 'descobrir') return;
  if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); doSkip(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); doLike(); }
  else if (e.key === 'ArrowUp' || e.key === 'Enter') { const k = topKey(); if (k) { e.preventDefault(); openProfile(k); } }
  else if (e.key.toLowerCase() === 'z') ACTS.undo();
});
document.addEventListener('input', e => { if (e.target.hasAttribute && e.target.hasAttribute('data-tpl')) updateTplPreview(); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'msgIn' && !e.shiftKey) { e.preventDefault(); e.target.closest('form').requestSubmit(); } });

render();
})();
</script>
