# Local development: database and Redis. The API and the web app run on the host
# (see docs/como_rodar_local.md at the WeOS repo root). Everything is prefixed vip-.
name: vip

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vip-db
    environment:
      POSTGRES_DB: vip
      POSTGRES_USER: vip
      POSTGRES_PASSWORD: vip
    ports:
      - "5439:5432"
    volumes:
      - vip-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vip -d vip"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: vip-redis
    ports:
      - "6382:6379"
    volumes:
      - vip-redis:/data

  # images and attachments: bucket "vip", keys <company-slug>/<kind>/<file>
  storage:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: vip-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vip
      MINIO_ROOT_PASSWORD: vip-storage-dev
    ports:
      - "9008:9000"
      - "9009:9001"
    volumes:
      - vip-storage:/data

volumes:
  vip-db:
  vip-redis:
  vip-storage:
